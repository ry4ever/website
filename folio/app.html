<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101217'/%3E%3Cg transform='translate(6 6)'%3E%3Crect x='2.6' y='3.2' width='10' height='13.6' rx='2.8' fill='%23fff' opacity='.42'/%3E%3Crect x='7.2' y='2.4' width='10.2' height='15.2' rx='2.8' fill='%23fff'/%3E%3Cpath d='M10.2 7.4h4.2M10.2 10.2h4.2M10.2 13h2.4' stroke='%23101217' stroke-width='1.6' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="img/icon-180.png" />
    <meta name="theme-color" content="#f3f7fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;550;600;650;700;800&family=Geist+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/views.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var root = document.documentElement
        var s = JSON.parse(localStorage.getItem('folio.workspace.v1') || '{}').settings || {}
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        // In "system" mode, keep a theme the embedding page already chose.
        if (!root.hasAttribute('data-theme') || (s.theme && s.theme !== 'system')) {
          window.__folioTheme = dark ? 'dark' : 'light'
          root.setAttribute('data-theme', window.__folioTheme)
        }
        var wall = s.wallpaper || 'sky'
        if (wall !== 'none') root.className += ' wall-' + wall + ' has-wall'
        if (s.accent && s.accent !== 'indigo') root.setAttribute('data-accent', s.accent)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
      <div id="resizer" class="sidebar-resizer" title="Drag to resize · Double-click to reset"></div>
      <main class="main">
        <header id="topbar" class="topbar"></header>
        <div id="scroller" class="scroller"><div id="view"></div></div>
        <aside id="peek" class="peek" aria-label="Page preview"></aside>
      </main>
    </div>
    <div id="overlay-root"></div>

    <script src="js/util.js"></script>
    <script src="js/emoji.js"></script>
    <script src="js/store.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/md.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/database.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/kit.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/habits.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Cache the app for offline use when served over http(s). Sandboxed frames refuse this, which is fine.
      try {
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
          addEventListener('load', function() {
            try {
              navigator.serviceWorker.register('sw.js').catch(function() {})
            } catch (e) {}
          })
        }
      } catch (e) {}
    </script>
  </body>
</html>
